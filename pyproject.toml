[project]
name = "school-climate-hub"
version = "0.1.0"
description = "Open infrastructure for school-level climate exposure data and operational tools for children's health."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Beaconhouse Technology" },
    { name = "Premier DLC" },
]
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "xarray>=2024.3",
    "netcdf4>=1.6",
    "requests>=2.32",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
# Repo root is a flat layout with several non-package top-level dirs
# (data/, worker/, dashboard/, docs/, downloads/, scripts/, advisory/,
# open_data_layer/). Setuptools' automatic package discovery can't
# disambiguate that, so the importable packages are listed explicitly.
packages = ["scoring", "ingestion"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
